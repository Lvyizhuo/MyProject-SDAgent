name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 最小权限：CI 只读仓库内容
permissions:
  contents: read

# 同一分支的旧运行自动取消，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 后端：Spring Boot + Maven Wrapper ============
  backend:
    name: Backend · JDK 21
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # enforcer 校验 JDK/Maven 版本；jacoco 生成覆盖率并在低于阈值时失败
      - name: Run unit tests with coverage gate
        run: ./mvnw -B clean test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # ============ 前端：Vite + pnpm ============
  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          # 与 package.json 的 packageManager 字段保持一致
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
