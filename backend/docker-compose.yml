# ===========================================
# 【方式二】本地开发 —— 仅中间件（后端/前端跑在宿主机热重载）
#
# 由 scripts/dev.sh 调用（COMPOSE_PROJECT_NAME=policy-agent-dev）
# 只启动依赖服务：postgres / redis / minio / ollama / ollama-init / reranker
# 后端与前端由 scripts/dev.sh 在宿主机以开发模式启动（热重载）
#
# 与【方式一】一键部署（deploy/docker-compose.yml）完全隔离：
#   项目名   policy-agent-dev  vs  policy-agent
#   端口段   15433/16379/19000/19001/211434/18989  vs  5433/6379/9000/9001/11434/8989
#   数据卷   policy-agent-dev_*  vs  policy-agent_*
#   因此两种方式可在同一台机器上同时运行，互不抢占端口与数据
# ===========================================

services:

  postgres:
    image: pgvector/pgvector:pg16
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      POSTGRES_DB: policy_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未配置}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER 未配置}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD 未配置}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_OLLAMA_PORT:-21434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_QUEUE: 64
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  ollama-init:
    # 启动时拉取默认嵌入模型：bge-m3 (1024 维) + nomic-embed-text 备用 (768 维)
    # 拉取失败不阻塞启动（应用启动时再去 try 拉取）
    image: ollama/ollama:latest
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama pull bge-m3 || true; ollama pull nomic-embed-text:latest || true; echo ollama-init-done"]

  reranker:
    build:
      context: ../rerank-service
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_RERANKER_PORT:-18989}:80"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      RERANK_MODEL_ID: ${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      PORT: "80"
      TZ: ${TZ:-Asia/Shanghai}
      # ⚠️ 不设 HF_ENDPOINT，走官方 huggingface.co。
      # 历史教训：hf-mirror.com 返回 308 重定向，huggingface_hub
      # 在 HEAD 请求时不跟随重定向就放弃，导致模型永远下载失败。
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; r=urllib.request.urlopen('http://localhost:80/health'); d=json.loads(r.read()); exit(0 if d.get('status')=='ok' else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 30

volumes:
  # 卷名显式指定，默认与项目名一致（policy-agent-dev_*）
  postgres_data:
    name: ${COMPOSE_VOLUME_PREFIX:-policy-agent-dev}_postgres_data
  redis_data:
    name: ${COMPOSE_VOLUME_PREFIX:-policy-agent-dev}_redis_data
  minio_data:
    name: ${COMPOSE_VOLUME_PREFIX:-policy-agent-dev}_minio_data
  ollama_data:
    name: ${COMPOSE_VOLUME_PREFIX:-policy-agent-dev}_ollama_data
  huggingface_cache:
    # 与一键部署实例共用同一份 HF 模型缓存（模型文件只读共享安全）。
    # 默认指向 policy-agent 命名空间下的缓存卷，避免重复下载 568MB 模型；
    # 如需完全隔离，把 HF_CACHE_VOLUME 设为 policy-agent-dev_huggingface_cache。
    name: ${HF_CACHE_VOLUME:-policy-agent_huggingface_cache}
