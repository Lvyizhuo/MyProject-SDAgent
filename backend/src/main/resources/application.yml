# ===========================================
# 山东省智能政策咨询助手 - 应用配置
# ===========================================

spring:
  application:
    name: policy-agent

  # 未显式激活 profile 时默认使用 dev（本地开发开箱即用）。
  # 生产环境由 deploy/docker-compose.yml 显式指定 SPRING_PROFILES_ACTIVE=prod,mcp。
  profiles:
    default: dev

  # Multipart 上传限制
  servlet:
    multipart:
      # 单文件最大 30MB
      max-file-size: 30MB
      # 单次请求总大小最大 30MB
      max-request-size: 30MB

  # PostgreSQL + PgVector 配置
  # 连接信息一律来自环境变量（SPRING_DATASOURCE_*），仓库内不保存任何明文凭据；
  # 本地开发的默认值见 application-dev.yml。
  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway 数据库版本化迁移：启动时执行 classpath:db/migration 下的 V*.sql
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 存量库（ddl-auto 建表且无 history 表）首次接入 Flyway 时自动 baseline，
    # baseline 版本设为 0 而不是默认的 1，确保 V1 建表脚本不会被 baseline 记录吞掉。
    baseline-version: 0
    placeholder-replacement: false

  # Redis 配置 (用于 ChatMemory)
  data:
    redis:
      host: localhost
      port: 6379

  # Spring AI 配置 - 使用阿里云 DashScope (通义千问)
  ai:
    openai:
      # 使用 DashScope API (OpenAI 兼容接口)
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    
    # PgVector 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        max-document-batch-size: 10000

    # MCP 客户端默认关闭自动初始化，避免未配置时启动失败
    mcp:
      client:
        enabled: true
        initialized: false

# 服务器配置
server:
  address: 0.0.0.0
  port: 8080

# OpenAPI 文档（springdoc，ApiFox 可通过 /v3/api-docs 导入）
# 默认关闭，仅本地开发（dev profile）开启，避免生产环境暴露接口清单
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:false}
  info:
    title: AI 政策通·智能体服务平台 API
    description: 山东省以旧换新政策咨询系统 - RAG 检索增强 + 多智能体架构
    version: v1.0.0

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 不对外暴露健康检查细节，避免泄露组件拓扑与连接信息
      show-details: never
  metrics:
    tags:
      application: policy-agent

# 日志配置
#
# 详细规则见 backend/src/main/resources/logback-spring.xml：
#   格式  复用 Spring Boot 内置 CONSOLE_LOG_PATTERN / FILE_LOG_PATTERN，
#         控制台与文件逐行同构（仅控制台带 ANSI 颜色）。
#   命名  活动文件 = <组件名>-<日期>.log，例：backend-2026-11-10.log
#   切分  纯按容量切分（100MB），不压缩，方便直接查看/grep/tail
#   保留  30 天，由启动脚本 / 容器 entrypoint 清理过期文件
#
# 这里只保留"日志级别"与"目录"两个需要在 yml 里声明的项；
# 文件名、日期、容量切分等全部在 logback-spring.xml 中定义。
logging:
  level:
    root: INFO
    com.shandong.policyagent: ${APP_LOG_LEVEL:INFO}
    org.springframework.ai: ${APP_LOG_LEVEL_SPRING_AI:INFO}
  # 日志目录（相对进程工作目录；容器内由 compose 注入绝对路径 /app/logs）
  file:
    path: ${LOGGING_FILE_PATH:logs}

# DashScope 多模态配置
dashscope:
  multimodal:
    api-key: ${DASHSCOPE_API_KEY}
    base-url: https://dashscope.aliyuncs.com/api/v1
    asr:
      model: qwen3-asr-flash
      # 长音频使用 filetrans 模型
      long-audio-model: qwen3-asr-flash-filetrans
    vision:
      model: qwen-vl-plus
      # 高精度场景使用 max 模型
      high-quality-model: qwen-vl-max

# 应用配置
app:
  log:
    # 日志日期：环境变量 LOG_DATE（由 dev.sh / 容器 entrypoint 注入当天日期）
    # 未注入时兜底为 unknown，文件名为 backend-unknown.log
    date: ${LOG_DATE:unknown}
    # 组件名（决定日志文件名前缀），默认 backend
    name: ${LOG_APP_NAME:backend}

  chat:
    mode: sync-only # sync-only | dual

  # JWT 配置
  jwt:
    # Base64 编码签名密钥，必须通过环境变量 APP_JWT_SECRET 提供（缺失时启动快速失败）
    secret: ${APP_JWT_SECRET:}
    # Token 有效期 (毫秒) - 默认 24 小时
    expiration: 86400000

  # RAG 配置 (旧方式，已禁用)
  rag:
    document-path: data
    scraped:
      enabled: false
      policy-json-paths:
        - scripts/data/scraped/policies.json
        - data/scraped/policies.json
    incremental:
      enabled: true
      state-file-path: data/.rag-ingestion-state.json
    bootstrap:
      auto-load-on-startup: false
    # 注意：当前 RAG 检索链路读取的是 app.rag.retrieval（RagConfig）
    retrieval:
      # 最终返回的文档数。3→2：单轮 RAG 上下文从 ~4700 token 降到 ~3100，
      # 配合 parent 扩展半径归零后收益更明显（实测 top-3 命中率高，top-2 仍覆盖主诉求）。
      top-k: 2
      similarity-threshold: 0.5
      # 送入 rerank 的候选数。20→10→6：rerank 在 CPU 上约 380~670ms/候选（实测真实政策
      # chunk 约 420 字/条），是 RAG 阶段 90%+ 的耗时来源；候选减半后检索质量基本不变
      # （RRF 融合后头部排序稳定），但检索阶段耗时近似线性下降。
      candidate-top-k: 6
      rerank-enabled: true
      rerank-provider: ${APP_RAG_RERANK_PROVIDER:tei}
      rerank-model: ${APP_RAG_RERANK_MODEL:bge-reranker-v2-m3}
      rerank-endpoint: ${APP_RAG_RERANK_ENDPOINT:http://localhost:8989/rerank}
      # 送入 rerank 的单条最大字符数。3000→800：rerank 耗时与 token 数成正比，
      # 而真实 chunk 均长约 420 字（最大 768），800 已能覆盖绝大多数，
      # 避免个别超长片段把整批推理时间拉高（实测 10 条候选 3.8s → 6.8s 的波动主因）。
      rerank-max-doc-chars: 800
      # 检索结果级缓存 TTL（分钟），0 表示禁用。
      # 缓存键：SHA-256(query|embeddingModelId|folderPath|topK|similarityThreshold|rerank配置)
      # 缓存值：完整 Document 列表（JSON 序列化，含 id/text/metadata）
      # Redis 不可用或序列化失败时静默降级为不缓存，不影响主链路。
      cache-ttl-minutes: 30
      # 语义化缓存：改写问法也能命中（政策咨询类问题的措辞差异极大，纯文本键命中率≈0）。
      # 开启后按 query 嵌入向量做近似匹配，相似度低于 semantic-threshold 视为不同问题。
      semantic-cache-enabled: true
      semantic-cache-threshold: 0.92
      # 预热：启动后后台把常见政策问法的检索结果灌入缓存
      warmup-enabled: true
      warmup-delay-seconds: 20

  # Knowledge Base 配置 (新方式)
  knowledge:
    # 目录导入白名单根目录：/api/documents/load-directory 仅允许加载该目录内的路径（防路径穿越）
    import-root: ${APP_KNOWLEDGE_IMPORT_ROOT:data}
    ingest:
      scheduler-enabled: true
      poll-interval-ms: 2000
      batch-size: 20
      max-concurrent: 2
      max-per-minute: 30
    minio:
      endpoint: ${APP_KNOWLEDGE_MINIO_ENDPOINT:http://localhost:9000}
      # 凭据不写默认值：缺失时启动即失败，避免静默使用公开的示例账号
      access-key: ${APP_KNOWLEDGE_MINIO_ACCESS_KEY:}
      secret-key: ${APP_KNOWLEDGE_MINIO_SECRET_KEY:}
      bucket-name: ${APP_KNOWLEDGE_MINIO_BUCKET:policy-documents}

    embedding:
      default-model: ${APP_KNOWLEDGE_EMBEDDING_DEFAULT_MODEL:ollama:bge-m3}
      models:
        - id: ollama:bge-m3
          provider: ollama
          base-url: ${APP_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
          model-name: bge-m3
          dimensions: 1024
          vector-table: vector_store_ollama_bge_m3_1024
          max-input-chars: 8000
        - id: ollama:nomic-embed-text
          provider: ollama
          base-url: ${APP_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
          model-name: nomic-embed-text:latest
          dimensions: 768
          vector-table: vector_store_ollama_nomic_768
          max-input-chars: 900
        - id: dashscope:text-embedding-v3
          provider: dashscope
          base-url: https://dashscope.aliyuncs.com/compatible-mode
          api-key: ${DASHSCOPE_API_KEY}
          model-name: text-embedding-v3
          dimensions: 1024
          vector-table: vector_store_dashscope_v3
          max-input-chars: 6000
    migration:
      enabled: ${APP_KNOWLEDGE_MIGRATION_ENABLED:false}
      target-model: ${APP_KNOWLEDGE_MIGRATION_TARGET_MODEL:ollama:bge-m3}
    chunking:
      default-chunk-size: 900
      min-chunk-size-chars: 250
      min-chunk-length-to-embed: 5
      chunk-overlap: 150
      keep-separator: true
      no-split-max-chars: 900
    # 检索参数统一走 app.rag.retrieval，避免与 app.knowledge.retrieval 双轨导致配置混淆

  # Advisor 配置
  advisor:
    # ChatMemory 配置
    memory:
      ttl-days: 7
      summary-enabled: true
      summary-trigger-messages: 6
      summary-keep-messages: 2
      summary-max-chars: 1200
      summary-timeout-seconds: 8
    # Security Advisor 配置
    security:
      enabled: true
    # ReReading Advisor 配置
    re-reading:
      enabled: true
    # Logging Advisor 配置
    logging:
      log-token-usage: true
      log-retrieved-docs: true

  # 联网搜索配置 (Tavily Search API)
  websearch:
    enabled: true
    timeout-seconds: 15
    singleflight-enabled: true
    async-vector-cache: true
    stale-while-revalidate: true
    cache-to-vectorstore: true
    cache:
      ttl-minutes: 120
      revalidate-on-expire: true
      serve-stale-on-error: true
    tavily:
      api-key: ${TAVILY_API_KEY:}
      base-url: https://api.tavily.com
      search-depth: advanced
      max-results: 5

  # ReAct 智能体工作流配置
  agent:
    planning-enabled: true
    max-planning-steps: 4
    planning-timeout-seconds: 15
    # ReAct 规划专用线程池（避免阻塞 ForkJoinPool.commonPool）
    planner-pool:
      core-size: 2
      max-size: 4
      queue-capacity: 50
    fast-path-enabled: true
    pre-rag-enabled: true
    pre-rag-direct-threshold: 0.86
    react-complexity-threshold: 0.65

  qa-cache:
    enabled: true
    ttl-minutes: 1440
    semantic-threshold: 0.92
    bucket-prefix-bits: 14

  price-cache:
    ttl-minutes: 1440
    prefetch-max-results: 3
    prefetch-await-enabled: true
    # A6 优化：等待上限从 6s 缩短为 1s，降低主线程阻塞（首问价格体验为"正在查价"，下轮命中缓存）
    prefetch-await-max-seconds: 1
    prefetch-await-poll-millis: 200

  # CORS 允许来源：生产环境通过环境变量 APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS（逗号分隔）注入；
  # 本地开发白名单见 application-dev.yml。此处刻意不定义该键——若定义为空占位符，
  # Spring 会绑定成空列表从而拒绝所有来源；不定义时 SecurityConfig 才能回退到内置安全默认集合。

  tools:
    retry:
      max-attempts: 2
      backoff-millis: 350

  model-provider:
    openai:
      connect-timeout-seconds: 10
      read-timeout-seconds: 90
    direct:
      connect-timeout-seconds: 10
      read-timeout-seconds: 90
