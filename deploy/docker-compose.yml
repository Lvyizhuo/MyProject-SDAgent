# ===========================================
# 完整 Docker Compose (宝塔反向代理 + Docker 容器)
# 适用：阿里云 / 其他 Linux 服，绑定 127.0.0.1 仅本机访问
# 外部 Nginx (宝塔) 反代到 127.0.0.1:5173 (前端) + 127.0.0.1:8080 (后端)
# ===========================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy-agent-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      POSTGRES_DB: policy_agent
      POSTGRES_USER: postgres
      # 必填：缺失时 compose 直接报错退出，避免静默使用弱口令
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未在 .env 中设置}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: policy-agent-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: policy-agent-minio
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?MINIO_USER 未在 .env 中设置}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD 未在 .env 中设置}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: policy-agent-ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_QUEUE: 64
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  ollama-init:
    # 启动时拉取默认嵌入模型：bge-m3 (1024 维) + nomic-embed-text 备用 (768 维)
    # 即使拉取失败也返回成功（exit 0），应用启动后由 fallback 兜底
    image: ollama/ollama:latest
    container_name: policy-agent-ollama-init
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["sh", "-c", "ollama pull bge-m3 || true; ollama pull nomic-embed-text:latest || true; echo ollama-init-done"]

  reranker:
    build:
      context: ../rerank-service
      dockerfile: Dockerfile
    container_name: policy-agent-reranker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:80"
    volumes:
      # HuggingFace 模型缓存，跨容器重启持久化（避免每次重新下载 568MB 模型）
      - huggingface_cache:/root/.cache/huggingface
    environment:
      RERANK_MODEL_ID: ${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      PORT: "80"
      TZ: ${TZ:-Asia/Shanghai}
      # ⚠️ 不设 HF_ENDPOINT，走官方 huggingface.co。
      # 历史教训：hf-mirror.com 返回 308 重定向，huggingface_hub
      # 在 HEAD 请求时不跟随重定向就放弃，导致模型永远下载失败。
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    healthcheck:
      # /health 端点：
      #   - status=starting/loading: 200 OK（模型后台加载中）
      #   - status=ok: 200 OK（模型就绪）
      # urllib.request.urlopen 收到 200 就视为 healthy
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; r=urllib.request.urlopen('http://localhost:80/health'); d=json.loads(r.read()); exit(0 if d.get('status')=='ok' else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      # 留 10 分钟给首次模型下载（hf-mirror.com 大约 3-5 分钟）
      start_period: 600s
      retries: 30

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: policy-agent-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # 高德地图 MCP Server 的 API Key：mcp-servers.json 已不含明文，
      # 由 npx 子进程从进程环境变量 AMAP_MAPS_API_KEY 读取
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET 未在 .env 中设置}
      APP_MODEL_PROVIDER_ENCRYPTION_SECRET: ${APP_MODEL_PROVIDER_ENCRYPTION_SECRET:-}
      APP_MODEL_PROVIDER_LEGACY_ENCRYPTION_SECRETS: ${APP_MODEL_PROVIDER_LEGACY_ENCRYPTION_SECRETS:-}
      APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:-http://mmgg.dpdns.org,https://mmgg.dpdns.org}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/policy_agent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未在 .env 中设置}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_KNOWLEDGE_MINIO_ENDPOINT: http://minio:9000
      APP_KNOWLEDGE_MINIO_ACCESS_KEY: ${MINIO_USER:?MINIO_USER 未在 .env 中设置}
      APP_KNOWLEDGE_MINIO_SECRET_KEY: ${MINIO_PASSWORD:?MINIO_PASSWORD 未在 .env 中设置}
      APP_EMBEDDING_OLLAMA_BASE_URL: http://ollama:11434
      APP_RAG_RERANK_PROVIDER: tei
      APP_RAG_RERANK_MODEL: bge-reranker-v2-m3
      APP_RAG_RERANK_ENDPOINT: http://reranker:80/rerank
      # prod：关闭接口文档、日志回落到 INFO；mcp：启用 MCP 客户端
      SPRING_PROFILES_ACTIVE: prod,mcp
      APP_KNOWLEDGE_MIGRATION_ENABLED: "true"
      APP_KNOWLEDGE_MIGRATION_TARGET_MODEL: ollama:bge-m3
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      reranker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 给 Flyway V9 迁移 + knowledge 迁移 + 5 agent seed 留够时间
      start_period: 240s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: policy-agent-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  huggingface_cache:
