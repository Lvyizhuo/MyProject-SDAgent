# ===========================================
# 统一日志格式
# ===========================================
# 与后端 logback 的 FILE_LOG_PATTERN 对齐：ISO-8601 带时区时间戳开头，
# 其后用 key=value 承载结构化字段，便于跨组件 grep / awk 切分。
# $time_iso8601 形如 2026-11-10T11:35:47+08:00（nginx 取容器本地时区）。
log_format unified '$time_iso8601 component=frontend type=access status=$status method=$request_method uri=$uri bytes=$body_bytes_sent rt=$request_time client=$remote_addr ua="$http_user_agent"';

# 从 $time_iso8601 截出日期部分（YYYY-MM-DD），用于生成带日期的日志文件名。
# nginx 的 access_log 路径支持变量，且每次 reopen（USR1）时会重新求值，
# 因此配合每日 00:05 的 reopen 即可实现"每天一个日志文件"。
map $time_iso8601 $log_date {
    "~^([0-9]{4})-([0-9]{2})-([0-9]{2})" $1-$2-$3;
    default $time_iso8601;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志双写：
    #   1) 容器内真实文件 /app/logs/frontend-<日期>.log —— 每天一个文件，不压缩
    #   2) stdout —— 交给 Docker json-file，保证 `docker compose logs frontend`
    #      与其他组件的读取方式一致
    access_log /app/logs/frontend-$log_date.log unified;
    access_log /dev/stdout unified;

    # 错误日志：统一到 /app/logs（nginx 的 error_log 路径不支持变量，故用固定名）
    error_log /app/logs/frontend-error.log warn;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router History 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理（Docker 部署时必须开启，否则前端 /api 请求会被 SPA 路由兜底）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式对话需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Actuator 监控端点代理
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
    }

    # 健康检查（探针流量不记日志，避免淹没访问日志）
    location /health {
        access_log off;
        return 200 "OK";
    }
}
